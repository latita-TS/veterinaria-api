# Configuración SOLO para las pruebas: usa H2 (base de datos en memoria)
# para que los tests funcionen aunque Docker/MySQL no esté encendido.
spring.datasource.url=jdbc:h2:mem:vet_test;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

