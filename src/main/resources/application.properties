# ==========================================================
#  VetCitas API - Configuración
#  Los valores entre ${...} se pueden cambiar con variables de
#  entorno (así se configura la nube sin tocar el código).
#  Si no existe la variable, se usa el valor después de los ":".
# ==========================================================

spring.application.name=veterinaria-api

# Puerto (Render asigna PORT automáticamente)
server.port=${PORT:8080}

# ---------- Base de datos MySQL ----------
# Local: MySQL corriendo en Docker (docker-compose.yml)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/veterinaria_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima}
spring.datasource.username=${DB_USER:vet_user}
spring.datasource.password=${DB_PASSWORD:vet_pass123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------- JPA / Hibernate ----------
# update: crea y actualiza las tablas automáticamente a partir de las entidades
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ---------- JWT ----------
# Clave secreta en Base64 (mínimo 32 bytes). En la nube se reemplaza con JWT_SECRET.
app.jwt.secret=${JWT_SECRET:dmV0Y2l0YXMtY2xhdmUtc2VjcmV0YS1wYXJhLWRlc2Fycm9sbG8tbG9jYWwtMjAyNg==}
# Duración del token: 2 horas (en milisegundos)
app.jwt.expiration=${JWT_EXPIRATION:7200000}

# ---------- Usuario administrador inicial ----------
app.admin.username=${ADMIN_USER:admin}
app.admin.password=${ADMIN_PASSWORD:admin123}

# ---------- DevOps: monitoreo con Actuator ----------
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.info.env.enabled=true
info.app.nombre=VetCitas API
info.app.descripcion=Servicios web REST para la gestión de citas veterinarias
info.app.version=1.0.0

# Fechas en formato ISO y zona horaria de Perú
spring.jackson.time-zone=America/Lima
